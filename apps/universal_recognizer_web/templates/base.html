<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Neural Engine • Universal Character Recognizer{% endblock %}</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('serve_assets', filename='neural-engine-logo.png') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/cards.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/overlays.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/tabs.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/badges.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/notifications.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/draw.css') }}" />
  </head>
  <body class="theme-neural page-draw">
    <div class="page-shell">
      <div class="ambient-grid" aria-hidden="true"></div>
      <div class="ambient-glow ambient-glow--purple" aria-hidden="true"></div>
      <div class="ambient-glow ambient-glow--violet" aria-hidden="true"></div>

      {% block content %}{% endblock %}

      <div id="toastStack" class="toast-stack" aria-live="polite"></div>
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>
