<article class="app-card surface-card app-card--{{ app.slug }}" data-app-card>
  <div class="app-card__header">
    <div class="app-card__icon" aria-hidden="true">{{ app.icon }}</div>
  </div>

  <div class="app-card__body">
    <div class="app-card__title-block">
      <h3>{{ app.name }}</h3>
      <span class="app-card__status">{{ app.status }}</span>
    </div>
    <p>{{ app.description }}</p>
  </div>

  <div class="app-card__meta">
    <div class="data-block">
      <span class="data-block__label">Endpoint</span>
      <strong class="data-block__value">localhost:{{ app.port }}</strong>
    </div>
  </div>

  <div class="app-card__actions">
    <a
      class="button button--primary"
      href="{{ app.primary_url }}"
      target="_blank"
      rel="noreferrer"
      data-ripple
    >
      {{ app.primary_label }}
    </a>
    {% if app.secondary_url %}
      <a
        class="button button--ghost"
        href="{{ app.secondary_url }}"
        target="_blank"
        rel="noreferrer"
        data-ripple
      >
        {{ app.secondary_label }}
      </a>
    {% endif %}
  </div>
</article>
