          <section id="model-management" class="content-section">
            <div class="container">
              <div class="section-header">
                <h2 class="section-title">
                  <i class="fas fa-database"></i>
                  Model Management
                </h2>
                <p>Save and load trained neural network models</p>
              </div>

              <!-- Save Model Section -->
              <div id="modelSaveSection" style="display: none">
                <h4>💾 Save Trained Model</h4>

                <!-- Save All Checkbox -->
                <div class="save-mode-selection" style="margin-bottom: 20px">
                  <label class="checkbox-container modern-checkbox">
                    <input type="checkbox" id="saveAllModelsCheckbox" />
                    <span class="checkmark"></span>
                    <span class="checkbox-label">
                      <strong>Save All Trained Models</strong>
                      <span class="checkbox-description"
                        >Save all currently trained models with a common
                        prefix</span
                      >
                    </span>
                  </label>
                </div>

                <!-- Model Name/Prefix Input -->
                <div class="form-group">
                  <label class="form-label" id="modelNameLabel"
                    >Model Name</label
                  >
                  <input
                    type="text"
                    id="modelNameInput"
                    class="form-input"
                    placeholder="Enter model name..."
                  />
                  <small
                    class="form-help"
                    id="modelNameHelp"
                    style="display: none"
                  >
                    This will be used as a prefix for all trained models (e.g.,
                    "experiment1_coeff_to_roots")
                  </small>
                </div>

                <!-- Single Model Scenario Selection -->
                <div class="form-group" id="singleModelScenarioGroup">
                  <label class="form-label">Select Scenario</label>
                  <select id="scenarioSelect" class="form-input">
                    <option value="">Choose scenario to save...</option>
                  </select>
                </div>

                <!-- Batch Save Preview -->
                <div
                  id="batchSavePreview"
                  style="
                    display: none;
                    margin-bottom: 16px;
                    padding: 16px;
                    background: var(--surface-color);
                    border-radius: var(--radius-medium);
                    border: 1px solid var(--border-color);
                  "
                >
                  <h5
                    style="
                      margin: 0 0 12px 0;
                      color: var(--primary-color);
                      display: flex;
                      align-items: center;
                      gap: 8px;
                    "
                  >
                    <i class="fas fa-layer-group"></i>
                    Models to be saved:
                  </h5>
                  <div id="batchPreviewList" class="batch-preview-list"></div>
                </div>

                <button id="saveModelBtn" class="btn btn-primary">
                  <i class="fas fa-save"></i>
                  <span id="saveButtonText">Save Model</span>
                </button>
              </div>

              <!-- Enhanced Load Model Section with Multiple Selection -->
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">
                    <i class="fas fa-folder-open"></i>
                    Load Saved Models
                  </h3>
                </div>
                <div class="card-content">
                  <div class="form-group">
                    <label class="form-label">
                      Select Models
                      <span
                        class="models-count-badge"
                        id="modelsCountBadge"
                        style="display: none"
                      ></span>
                    </label>

                    <!-- Batch Selection Controls -->
                    <div
                      class="batch-selection-controls"
                      id="batchSelectionControls"
                      style="display: none; margin-bottom: 16px"
                    >
                      <button
                        type="button"
                        id="selectAllModelsBtn"
                        class="btn btn-secondary btn-small"
                      >
                        <i class="fas fa-check-double"></i>
                        Select All
                      </button>
                      <button
                        type="button"
                        id="deselectAllModelsBtn"
                        class="btn btn-secondary btn-small"
                      >
                        <i class="fas fa-times"></i>
                        Deselect All
                      </button>
                      <span class="selection-status" id="selectionStatus"
                        >No models selected</span
                      >
                    </div>

                    <!-- Models Grid -->
                    <div class="models-grid" id="modelsGrid">
                      <div class="no-models-message">
                        <i class="fas fa-folder-open"></i>
                        <p>No saved models available</p>
                      </div>
                    </div>
                  </div>

                  <div class="model-actions-grid">
                    <button id="loadModelBtn" class="btn btn-secondary">
                      <i class="fas fa-upload"></i>
                      <span id="loadButtonText">Load Models</span>
                    </button>
                    <button id="deleteModelBtn" class="btn btn-danger">
                      <i class="fas fa-trash-alt"></i>
                      Delete Selected
                    </button>
                    <button id="refreshModelsBtn" class="btn btn-outline">
                      <i class="fas fa-sync-alt"></i>
                      Refresh List
                    </button>
                  </div>
                </div>
              </div>

              <!-- Model Info Display -->
              <div class="card" id="modelInfoDisplay" style="display: none">
                <div class="card-header">
                  <h3 class="card-title">
                    <i class="fas fa-info-circle"></i>
                    Model Information
                  </h3>
                </div>
                <div class="card-content">
                  <div id="modelInfoContent" class="model-info-grid">
                    <!-- Model details will be populated here -->
                  </div>
                </div>
              </div>
            </div>
          </section>
