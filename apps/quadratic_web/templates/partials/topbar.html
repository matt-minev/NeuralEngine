<header class="topbar">
  <div class="brand-mark">
    <div class="brand-mark__logo">
      <img src="{{ url_for('serve_assets', filename='neural-engine-logo.png') }}" alt="Neural Engine logo" />
    </div>
    <div class="brand-mark__text">
      <span class="brand-mark__eyebrow">Neural Engine</span>
      <strong class="brand-mark__title">{{ topbar_title }}</strong>
      <span class="brand-mark__subtitle">{{ topbar_subtitle }}</span>
    </div>
  </div>

  <div class="topbar__actions">
    <div class="status-pill">
      <span class="status-pill__dot status-dot"></span>
      <span id="connection-status">Connected</span>
    </div>
  </div>
</header>
